<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body class="registration-page">


    <!-- Main Container -->
    <div class="container py-5">

        <!-- Registration Card -->
        <div class="card shadow-lg border-0 mx-auto registration-card">

            <div class="card-body p-4 p-md-5">


                <!-- Logo and Heading -->
                <div class="text-center">

                    <img src="studenthub_logo.png"
                         alt="StudentHub Logo"
                         width="100"
                         height="100"
                         class="mb-3">

                    <h1 class="fw-bold studenthub-title">
                        STUDENTHUB
                    </h1>

                    <h2 class="mt-3">
                        Student Registration
                    </h2>

                    <p class="text-muted">
                        Create your StudentHub account
                    </p>

                    <hr>

                </div>


                <!-- Registration Form -->
                <form id="registrationForm"
                      novalidate>


                    <div class="row">


                        <!-- Full Name -->
                        <div class="col-md-6 mb-3">

                            <label for="name"
                                   class="form-label fw-bold">

                                Full Name
                                <span class="required">*</span>

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   name="name"
                                   placeholder="Enter your full name">

                            <small id="nameError"
                                   class="error-message">
                            </small>

                        </div>


                        <!-- Email -->
                        <div class="col-md-6 mb-3">

                            <label for="email"
                                   class="form-label fw-bold">

                                Email Address
                                <span class="required">*</span>

                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="Enter your email">

                            <small id="emailError"
                                   class="error-message">
                            </small>

                        </div>


                        <!-- Mobile -->
                        <div class="col-md-6 mb-3">

                            <label for="mobile"
                                   class="form-label fw-bold">

                                Mobile Number
                                <span class="required">*</span>

                            </label>

                            <input type="tel"
                                   class="form-control"
                                   id="mobile"
                                   name="mobile"
                                   placeholder="Enter 10-digit mobile number"
                                   maxlength="10">

                            <small id="mobileError"
                                   class="error-message">
                            </small>

                        </div>


                        <!-- Course -->
                        <div class="col-md-6 mb-3">

                            <label for="course"
                                   class="form-label fw-bold">

                                Course
                                <span class="required">*</span>

                            </label>

                            <select class="form-select"
                                    id="course"
                                    name="course">

                                <option value="">
                                    Select Course
                                </option>

                                <option value="Computer Engineering">
                                    Computer Engineering
                                </option>

                                <option value="Information Technology">
                                    Information Technology
                                </option>

                                <option value="Mechanical Engineering">
                                    Mechanical Engineering
                                </option>

                                <option value="Civil Engineering">
                                    Civil Engineering
                                </option>

                                <option value="Electronics Engineering">
                                    Electronics Engineering
                                </option>

                            </select>

                            <small id="courseError"
                                   class="error-message">
                            </small>

                        </div>


                        <!-- Password -->
                        <div class="col-md-6 mb-3">

                            <label for="password"
                                   class="form-label fw-bold">

                                Password
                                <span class="required">*</span>

                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Enter password">

                            <small id="passwordError"
                                   class="error-message">
                            </small>

                        </div>


                        <!-- Confirm Password -->
                        <div class="col-md-6 mb-3">

                            <label for="confirmPassword"
                                   class="form-label fw-bold">

                                Confirm Password
                                <span class="required">*</span>

                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="confirmPassword"
                                   name="confirmPassword"
                                   placeholder="Confirm password">

                            <small id="confirmPasswordError"
                                   class="error-message">
                            </small>

                        </div>


                        <!-- Academic Year -->
                        <div class="col-md-6 mb-3">

                            <label for="year"
                                   class="form-label fw-bold">

                                Academic Year
                                <span class="required">*</span>

                            </label>

                            <select class="form-select"
                                    id="year"
                                    name="year">

                                <option value="">
                                    Select Year
                                </option>

                                <option value="First Year">
                                    First Year
                                </option>

                                <option value="Second Year">
                                    Second Year
                                </option>

                                <option value="Third Year">
                                    Third Year
                                </option>

                                <option value="Fourth Year">
                                    Fourth Year
                                </option>

                            </select>

                            <small id="yearError"
                                   class="error-message">
                            </small>

                        </div>


                        <!-- Gender -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                Gender
                                <span class="required">*</span>

                            </label>


                            <div class="mt-2">


                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="male"
                                           value="Male">

                                    <label class="form-check-label"
                                           for="male">

                                        Male

                                    </label>

                                </div>


                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="female"
                                           value="Female">

                                    <label class="form-check-label"
                                           for="female">

                                        Female

                                    </label>

                                </div>


                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="other"
                                           value="Other">

                                    <label class="form-check-label"
                                           for="other">

                                        Other

                                    </label>

                                </div>

                            </div>


                            <small id="genderError"
                                   class="error-message">
                            </small>

                        </div>


                        <!-- Terms -->
                        <div class="col-12 mb-3 mt-2">

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="terms"
                                       name="terms">

                                <label class="form-check-label"
                                       for="terms">

                                    I agree to the
                                    <a href="#">
                                        Terms & Conditions
                                    </a>

                                    <span class="required">*</span>

                                </label>

                            </div>

                            <small id="termsError"
                                   class="error-message">
                            </small>

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="text-center mt-4">

                        <button type="submit"
                                class="btn btn-primary px-4 me-2">

                            Create Account

                        </button>


                        <button type="reset"
                                class="btn btn-secondary px-4">

                            Clear

                        </button>

                    </div>


                    <!-- Success Message -->
                    <div id="registrationSuccess"
                         class="success-message">
                    </div>


                </form>


                <hr class="my-4">


                <!-- Login Link -->
                <div class="text-center">

                    <p class="mb-0">

                        Already have an account?

                        <a href="index.html">
                            Login here
                        </a>

                    </p>

                </div>


                <!-- Footer -->
                <div class="text-center text-muted mt-4">

                    <p class="mb-0">

                        <strong>StudentHub © 2026</strong>

                        <br>

                        Manage your academic information in one place.

                    </p>

                </div>


            </div>

        </div>

    </div>


    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>

</html>
