<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Announcements</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body style="background-color: rgb(7, 60, 107);
             font-family: Arial, sans-serif;">


    <div class="container py-5">


        <!-- Main Card -->

        <div class="card shadow mx-auto"
             style="max-width: 1000px;">


            <div class="card-body p-4">


                <!-- Logo and Heading -->

                <div class="text-center">

                    <img src="studenthub_logo.png"
                         alt="StudentHub Logo"
                         width="100"
                         height="100"
                         class="mb-3">


                    <h1 class="fw-bold"
                        style="color: rgb(7, 60, 107);">

                        STUDENTHUB

                    </h1>


                    <h2>

                        Announcements

                    </h2>


                    <hr>

                </div>



                <!-- =====================================
                     SEARCH
                     ===================================== -->

                <div class="row g-3 mb-4">


                    <div class="col-md-5">

                        <label for="searchAnnouncement"
                               class="form-label fw-bold">

                            Search Announcements

                        </label>


                        <input type="text"
                               id="searchAnnouncement"
                               class="form-control"
                               placeholder="Search announcements...">

                    </div>



                    <!-- =====================================
                         CATEGORY FILTER
                         ===================================== -->

                    <div class="col-md-3">

                        <label for="categoryFilter"
                               class="form-label fw-bold">

                            Category

                        </label>


                        <select id="categoryFilter"
                                class="form-select">

                            <option value="all">

                                All Categories

                            </option>

                        </select>

                    </div>



                    <!-- =====================================
                         SORT
                         ===================================== -->

                    <div class="col-md-4">

                        <label for="sortAnnouncements"
                               class="form-label fw-bold">

                            Sort By

                        </label>


                        <select id="sortAnnouncements"
                                class="form-select">


                            <option value="newest">

                                Newest First

                            </option>


                            <option value="oldest">

                                Oldest First

                            </option>


                            <option value="titleAZ">

                                Title A-Z

                            </option>


                            <option value="titleZA">

                                Title Z-A

                            </option>


                        </select>

                    </div>

                </div>



                <!-- =====================================
                     LOADING MESSAGE
                     ===================================== -->

                <div id="announcementLoading"
                     class="text-center my-3">

                    Loading announcements...

                </div>



                <!-- =====================================
                     ERROR MESSAGE
                     ===================================== -->

                <div id="announcementError"
                     class="alert alert-danger"
                     style="display: none;">

                </div>



                <!-- =====================================
                     NO RESULTS
                     ===================================== -->

                <div id="noResults"
                     class="alert alert-info text-center"
                     style="display: none;">

                    No announcements found.

                </div>



                <!-- =====================================
                     ANNOUNCEMENTS TABLE
                     ===================================== -->

                <div class="table-responsive">


                    <table class="table table-bordered table-hover align-middle">


                        <thead class="table-primary text-center">


                            <tr>


                                <th>

                                    Date

                                </th>


                                <th>

                                    Category

                                </th>


                                <th>

                                    Announcement

                                </th>


                                <th>

                                    Description

                                </th>


                            </tr>


                        </thead>



                        <tbody id="announcementContainer">

                            <!--
                                Announcements will be
                                inserted here using JavaScript
                            -->

                        </tbody>


                    </table>

                </div>



                <!-- =====================================
                     PAGINATION
                     ===================================== -->

                <div id="announcementPagination"
                     class="text-center mt-4">

                </div>



                <!-- =====================================
                     BACK TO DASHBOARD
                     ===================================== -->

                <div class="text-center mt-4">


                    <a href="homepage.html"
                       class="btn btn-primary"
                       style="width: 200px;">

                        ← Back to Dashboard

                    </a>


                </div>



                <hr class="my-4">



                <!-- =====================================
                     FOOTER
                     ===================================== -->

                <div class="text-center">


                    <p class="mb-0">


                        <b>

                            StudentHub © 2026

                        </b>


                        <br>


                        Stay informed with the latest college announcements.


                    </p>


                </div>


            </div>


        </div>


    </div>



    <!-- =====================================
         BOOTSTRAP JAVASCRIPT
         ===================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =====================================
         EXISTING STUDENTHUB JAVASCRIPT
         ===================================== -->

    <script src="script.js">
    </script>



    <!-- =====================================
         ANNOUNCEMENTS JAVASCRIPT
         ===================================== -->

    <script src="announcements.js">
    </script>


</body>

</html>
