<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Student Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background-color: rgb(7, 60, 107); font-family: Arial, sans-serif;">

    <div class="container py-5">

        <!-- Main Card -->
        <div class="card shadow mx-auto"
             style="max-width: 900px;">

            <div class="card-body p-4">

                <!-- Logo and Heading -->
                <div class="text-center">

                    <img src="studenthub_logo.png"
                         alt="StudentHub Logo"
                         width="100"
                         height="100"
                         class="mb-3">

                    <h1 class="fw-bold"
                        style="color: rgb(7, 60, 107);">

                        STUDENTHUB

                    </h1>

                    <h2>
                        Student Profile
                    </h2>

                    <hr>

                </div>

                <!-- Profile Form -->
                <form>

                    <div class="row">

                        <!-- Student Name -->
                        <div class="col-md-6 mb-3">

                            <label for="studentName"
                                   class="form-label fw-bold">

                                Student Name

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="studentName"
                                   placeholder="Enter your full name">

                        </div>

                        <!-- Enrollment Number -->
                        <div class="col-md-6 mb-3">

                            <label for="enrollment"
                                   class="form-label fw-bold">

                                Enrollment Number

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="enrollment"
                                   placeholder="Enter enrollment number">

                        </div>

                        <!-- Department -->
                        <div class="col-md-6 mb-3">

                            <label for="department"
                                   class="form-label fw-bold">

                                Department

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="department"
                                   placeholder="Enter department">

                        </div>

                        <!-- Semester -->
                        <div class="col-md-6 mb-3">

                            <label for="semester"
                                   class="form-label fw-bold">

                                Semester

                            </label>

                            <select class="form-select"
                                    id="semester">

                                <option selected disabled>
                                    Select Semester
                                </option>

                                <option>Semester 1</option>
                                <option>Semester 2</option>
                                <option>Semester 3</option>
                                <option>Semester 4</option>
                                <option>Semester 5</option>
                                <option>Semester 6</option>
                                <option>Semester 7</option>
                                <option>Semester 8</option>

                            </select>

                        </div>

                        <!-- Date of Birth -->
                        <div class="col-md-6 mb-3">

                            <label for="dob"
                                   class="form-label fw-bold">

                                Date of Birth

                            </label>

                            <input type="date"
                                   class="form-control"
                                   id="dob">

                        </div>

                        <!-- Gender -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">
                                Gender
                            </label>

                            <div>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="male"
                                           value="Male">

                                    <label class="form-check-label"
                                           for="male">

                                        Male

                                    </label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="female"
                                           value="Female">

                                    <label class="form-check-label"
                                           for="female">

                                        Female

                                    </label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="gender"
                                           id="other"
                                           value="Other">

                                    <label class="form-check-label"
                                           for="other">

                                        Other

                                    </label>

                                </div>

                            </div>

                        </div>

                        <!-- Email -->
                        <div class="col-md-6 mb-3">

                            <label for="email"
                                   class="form-label fw-bold">

                                Email

                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   placeholder="Enter your email">

                        </div>

                        <!-- Phone -->
                        <div class="col-md-6 mb-3">

                            <label for="phone"
                                   class="form-label fw-bold">

                                Phone Number

                            </label>

                            <input type="tel"
                                   class="form-control"
                                   id="phone"
                                   placeholder="Enter phone number">

                        </div>

                        <!-- Address -->
                        <div class="col-12 mb-3">

                            <label for="address"
                                   class="form-label fw-bold">

                                Address

                            </label>

                            <textarea class="form-control"
                                      id="address"
                                      rows="4"
                                      placeholder="Enter your address"></textarea>

                        </div>

                        <!-- Father's Name -->
                        <div class="col-md-6 mb-3">

                            <label for="fatherName"
                                   class="form-label fw-bold">

                                Father's Name

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="fatherName"
                                   placeholder="Enter father's name">

                        </div>

                        <!-- Father's Occupation -->
                        <div class="col-md-6 mb-3">

                            <label for="fatherOccupation"
                                   class="form-label fw-bold">

                                Father's Occupation

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="fatherOccupation"
                                   placeholder="Enter occupation">

                        </div>

                        <!-- Mother's Name -->
                        <div class="col-md-6 mb-3">

                            <label for="motherName"
                                   class="form-label fw-bold">

                                Mother's Name

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="motherName"
                                   placeholder="Enter mother's name">

                        </div>

                        <!-- Mother's Occupation -->
                        <div class="col-md-6 mb-3">

                            <label for="motherOccupation"
                                   class="form-label fw-bold">

                                Mother's Occupation

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="motherOccupation"
                                   placeholder="Enter occupation">

                        </div>

                    </div>

                    <!-- Form Buttons -->
                    <div class="text-center mt-3">

                        <button type="submit"
                                class="btn btn-primary px-4 me-2">

                            Save Details

                        </button>

                        <button type="reset"
                                class="btn btn-secondary px-4">

                            Clear

                        </button>

                    </div>

                </form>

                <!-- Back to Dashboard -->
                <div class="text-center mt-4">

                    <a href="homepage.html"
                       class="btn btn-primary"
                       style="width: 200px;">

                        ← Back to Dashboard

                    </a>

                </div>

                <hr class="my-4">

                <!-- Footer -->
                <div class="text-center">

                    <p class="mb-0">

                        StudentHub © 2026

                        <br>

                        Manage your academic information in one place.

                    </p>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
