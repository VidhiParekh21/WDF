<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color: rgb(7, 60, 107); font-family: Arial, sans-serif;">

    <!-- Main Container -->
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <!-- Login Card -->
        <div class="card shadow-lg" style="width: 450px;">

            <div class="card-body p-5">

                <!-- Logo -->
                <div class="text-center">

                    <img src="studenthub_logo.png"
                         alt="StudentHub Logo"
                         width="120"
                         height="120"
                         class="mb-3">

                    <h1 class="fw-bold"
                        style="color: rgb(150, 43, 78);">
                        STUDENTHUB
                    </h1>

                    <hr>

                    <h2 class="mb-4">
                        Student Login
                    </h2>

                </div>

                <!-- Login Form -->
                <form action="homepage.html" method="get">

                    <!-- Username -->
                    <div class="mb-3">

                        <label for="username"
                               class="form-label fw-bold">

                            Username

                        </label>

                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               placeholder="Enter Username"
                               required>

                    </div>

                    <!-- Password -->
                    <div class="mb-3">

                        <label for="password"
                               class="form-label fw-bold">

                            Password

                        </label>

                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="Enter Password"
                               required>

                    </div>

                    <!-- Buttons -->
                    <div class="text-center mt-4">

                        <button type="submit"
                                class="btn btn-primary px-4 me-2">

                            Login

                        </button>

                        <button type="reset"
                                class="btn btn-secondary px-4">

                            Clear

                        </button>

                    </div>

                </form>

                <!-- Forgot Password -->
                <div class="text-center mt-3">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <hr>

                <!-- Description -->
                <div class="text-center">

                    <p class="mb-0">

                        Welcome to StudentHub Portal.

                        <br>

                        Access Attendance, Timetable, Assignments,

                        <br>

                        Study Notes, Academic Calendar, and more.

                    </p>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
